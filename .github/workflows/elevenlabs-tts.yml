name: ElevenLabs TTS test

# Issue body format:
# text: |
#   要轉換的繁體中文內容
# voice_ids:
#   - first_voice_id
#   - second_voice_id

on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: Optional ElevenLabs voice ID. Leave blank to use the test voice.
        required: false
        type: string
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  generate-mp3:
    name: Generate Traditional Chinese MP3
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[TTS]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ inputs.voice_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issues" ]]; then
            python scripts/generate_tts.py --issue-event-file "$GITHUB_EVENT_PATH"
          elif [[ -n "$VOICE_ID" ]]; then
            python scripts/generate_tts.py --voice-id "$VOICE_ID"
          else
            python scripts/generate_tts.py
          fi

      - name: Upload MP3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-tts-mp3
          path: output/*.mp3
          if-no-files-found: error
          retention-days: 7
  
